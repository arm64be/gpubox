<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nodestat</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: dark;
  --page: #111110; --card: #1a1a19; --line: #2c2c2a; --grid: #262624;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8d8c84;
  --s1: #3987e5; --s2: #d95926;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --page: #f4f4f2; --card: #fcfcfb; --line: #e3e2de; --grid: #ecebe7;
    --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #75746e;
    --s1: #2a78d6; --s2: #eb6834;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.45 var(--sans); }
main { max-width: 1480px; margin: 0 auto; padding: 20px 20px 48px; }
.num, .mono, dd, td { font-family: var(--mono); font-variant-numeric: tabular-nums; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 20px; margin-bottom: 14px; }
header h1 { margin: 0; font: 600 44px/1 var(--sans); letter-spacing: -0.02em; }
header .meta { color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 14px; padding-bottom: 4px; }
header .meta b { color: var(--ink); font-weight: 500; }
.live { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--ink-2); padding-bottom: 4px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.live[data-s=live] i { background: var(--good); }
.live[data-s=down] i { background: var(--critical); }

.banner { border: 1px solid var(--line); border-left: 4px solid var(--ink-3); background: var(--card);
  border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; color: var(--ink); }
.banner[data-sev=critical] { border-left-color: var(--critical); }
.banner[data-sev=warning] { border-left-color: var(--warning); }
.banner:empty { display: none; }

h2 { font: 600 12px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin: 22px 0 10px; }
.grid { display: grid; gap: 12px; }
.host { grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.panel h3 { margin: 0 0 8px; font: 600 13px/1.2 var(--sans); color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.panel h3 span { font-weight: 400; color: var(--ink-3); font-family: var(--mono); font-size: 12px; }
.hero { font: 600 30px/1.1 var(--sans); }
.hero small { font-size: 14px; font-weight: 400; color: var(--ink-2); }
.sub { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.sub b { color: var(--ink); font-weight: 500; }

.meter { height: 8px; border-radius: 4px; background: color-mix(in oklab, var(--s1) 18%, var(--card)); overflow: hidden; margin: 8px 0 2px; }
.meter i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--s1); transition: width .4s ease; }
.meter[data-sev=warning] { background: color-mix(in oklab, var(--warning) 18%, var(--card)); }
.meter[data-sev=warning] i { background: var(--warning); }
.meter[data-sev=serious] { background: color-mix(in oklab, var(--serious) 18%, var(--card)); }
.meter[data-sev=serious] i { background: var(--serious); }
.meter[data-sev=critical] { background: color-mix(in oklab, var(--critical) 18%, var(--card)); }
.meter[data-sev=critical] i { background: var(--critical); }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; align-items: baseline; margin: 8px 0; }
.mrow .meter { grid-column: 1 / -1; margin: 3px 0 0; }
.mrow .lbl { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .val { font-family: var(--mono); font-size: 12px; color: var(--ink); text-align: right; white-space: nowrap; }

canvas.spark { display: block; width: 100%; height: 44px; margin-top: 10px; cursor: crosshair; }
canvas.spark.tall { height: 64px; }
.legend { display: flex; gap: 14px; color: var(--ink-2); font-size: 12px; margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 5px; border-radius: 1px; }

.cores { display: grid; grid-template-columns: repeat(auto-fit, minmax(5px, 1fr)); gap: 2px; height: 34px; margin-top: 10px; }
.cores i { position: relative; background: color-mix(in oklab, var(--s1) 18%, var(--card)); border-radius: 2px; overflow: hidden; }
.cores i b { position: absolute; left: 0; right: 0; bottom: 0; background: var(--s1); border-radius: 2px 2px 0 0; }

table.psi { width: 100%; border-collapse: collapse; font-size: 12px; }
table.psi th { color: var(--ink-3); font-weight: 400; text-align: right; padding: 0 0 2px; }
table.psi th[colspan] { text-align: center; padding-left: 12px; }
table.psi th:first-child, table.psi td:first-child { text-align: left; font-family: var(--sans); color: var(--ink-2); }
table.psi td { text-align: right; padding: 3px 0; border-top: 1px solid var(--grid); }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 10px; font-size: 12px;
  border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.badge::before { font-weight: 700; }
.badge[data-sev=good]::before { content: "✓"; color: var(--good); }
.badge[data-sev=neutral]::before { content: "•"; color: var(--ink-3); }
.badge[data-sev=warning]::before { content: "▲"; color: var(--warning); }
.badge[data-sev=serious]::before { content: "▲"; color: var(--serious); }
.badge[data-sev=critical]::before { content: "✕"; color: var(--critical); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }

.gsum { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); margin-bottom: 12px; }
.gpus { grid-template-columns: repeat(auto-fill, minmax(min(100%, 620px), 1fr)); }
.gpu header { margin: 0 0 12px; align-items: baseline; gap: 4px 12px; }
.gpu header h3 { margin: 0; font: 600 18px/1.2 var(--sans); color: var(--ink); }
.gpu header .meta { font-size: 12px; padding: 0; }
.gpu header .badges { margin-left: auto; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 720px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile .k { color: var(--ink-2); font-size: 12px; }
.tile .v { font: 600 22px/1.15 var(--sans); margin-top: 2px; white-space: nowrap; }
.tile .v small { font-size: 12px; font-weight: 400; color: var(--ink-2); }
.tile .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
dl.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0 24px; margin: 14px 0 0; padding-top: 10px; border-top: 1px solid var(--grid); }
dl.facts div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--grid); min-width: 0; }
dl.facts dt { color: var(--ink-2); white-space: nowrap; }
dl.facts dd { margin: 0; text-align: right; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
dl.facts div[hidden] { display: none; }
.stale { opacity: .45; }

#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--card); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 16px #0006; display: none; white-space: nowrap; }
#tip .t { color: var(--ink-3); margin-bottom: 2px; }
#tip .r { display: flex; align-items: center; gap: 6px; }
#tip .r i { width: 10px; height: 2px; border-radius: 1px; }
#tip .r b { font-family: var(--mono); font-weight: 500; margin-left: auto; padding-left: 12px; }
.empty { color: var(--ink-3); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="name">…</h1>
    <div class="meta" id="meta"></div>
    <div class="live" id="live" data-s="wait"><i></i><span>connecting</span></div>
  </header>
  <div class="banner" id="banner"></div>

  <h2>Host</h2>
  <section class="grid host">
    <div class="panel" id="p-cpu">
      <h3>CPU <span data-k="cores"></span></h3>
      <div class="hero num" data-k="cpu">–</div>
      <div class="sub" data-k="cpusub"></div>
      <div class="cores" data-k="coregrid"></div>
      <canvas class="spark" data-spark="cpu"></canvas>
    </div>
    <div class="panel" id="p-mem">
      <h3>Memory <span data-k="memscope"></span></h3>
      <div class="hero num" data-k="mem">–</div>
      <div data-k="memrows"></div>
      <canvas class="spark" data-spark="mem"></canvas>
    </div>
    <div class="panel" id="p-psi">
      <h3>Pressure stalls <span>% of time stalled</span></h3>
      <div class="badges" data-k="psibadge"></div>
      <table class="psi" style="margin-top:8px">
        <thead><tr><th></th><th colspan="2">some</th><th colspan="2">full</th></tr>
               <tr><th></th><th>10s</th><th>60s</th><th>10s</th><th>60s</th></tr></thead>
        <tbody data-k="psitable"></tbody>
      </table>
      <canvas class="spark" data-spark="psi"></canvas>
    </div>
    <div class="panel" id="p-net">
      <h3>Network <span data-k="nettotal"></span></h3>
      <div class="hero num"><span data-k="rx">–</span> <small>in</small></div>
      <div class="sub">out <b data-k="tx">–</b></div>
      <canvas class="spark tall" data-spark="net"></canvas>
      <div class="legend"><span><i style="background:var(--s1)"></i>in</span><span><i style="background:var(--s2)"></i>out</span></div>
    </div>
    <div class="panel" id="p-disk">
      <h3>Disks</h3>
      <div data-k="disks"></div>
    </div>
  </section>

  <h2 id="gpu-h">GPUs</h2>
  <section class="grid gsum" id="gsum" hidden></section>
  <section class="grid gpus" id="gpus"></section>
</main>
<div id="tip"></div>

<script>
"use strict";
const WINDOW = 900;          // seconds of history drawn in sparklines
const H = [];                // history rows: [t, cpu, mem, psi, rx, tx, [[util, mem, W, C, MHz], ...]]
let S = null;                // latest snapshot

// ------------------------------------------------------------ formatting
const ok = v => typeof v === "number" && Number.isFinite(v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function bytes(v, digits = 1) {
  if (!ok(v)) return "–";
  const u = ["B", "KiB", "MiB", "GiB", "TiB", "PiB"];
  let i = 0;
  while (Math.abs(v) >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v.toFixed(0) : v.toFixed(v >= 100 ? 0 : digits)) + " " + u[i];
}
const rate = v => ok(v) ? bytes(v) + "/s" : "–";
const pct = v => ok(v) ? Math.round(v) + "%" : "–";
const int = (v, unit = "") => ok(v) ? Math.round(v).toLocaleString() + unit : "–";
function dur(s) {
  if (!ok(s)) return "–";
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m ${Math.floor(s % 60)}s` : `${Math.floor(s)}s`;
}
const clock = t => new Date(t * 1000).toLocaleTimeString([], {hour12: false});
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function set(root, k, text) {
  const el = root.querySelector(`[data-k="${k}"]`);
  if (el && el.textContent !== text) el.textContent = text;
  return el;
}
function html(root, k, h) {
  const el = root.querySelector(`[data-k="${k}"]`);
  if (el && el._h !== h) { el.innerHTML = h; el._h = h; }
  return el;
}
function meter(frac, sev = "") {
  const w = ok(frac) ? Math.max(0, Math.min(1, frac)) * 100 : 0;
  return `<div class="meter"${sev ? ` data-sev="${sev}"` : ""}><i style="width:${w.toFixed(1)}%"></i></div>`;
}
const badge = (sev, label) => `<span class="badge" data-sev="${sev}">${esc(label)}</span>`;
const SEVLABEL = {good: "ok", warning: "warning", serious: "high", critical: "critical"};

// ------------------------------------------------------------ sparklines
const sparks = new Map();      // canvas -> {series, max, fmt}
const tip = document.getElementById("tip");

function spark(canvas, series, opt = {}) {
  sparks.set(canvas, {series, max: opt.max || (() => null), fmt: opt.fmt || (v => String(v)), hover: null});
  canvas.addEventListener("mousemove", e => {
    const sp = sparks.get(canvas), r = canvas.getBoundingClientRect();
    sp.hover = (e.clientX - r.left) / r.width;
    draw(canvas);
    showTip(canvas, e);
  });
  canvas.addEventListener("mouseleave", () => { sparks.get(canvas).hover = null; tip.style.display = "none"; draw(canvas); });
}

function nearestRow(t) {
  let lo = 0, hi = H.length - 1;
  if (hi < 0) return null;
  while (lo < hi) { const m = (lo + hi) >> 1; if (H[m][0] < t) lo = m + 1; else hi = m; }
  if (lo > 0 && Math.abs(H[lo - 1][0] - t) < Math.abs(H[lo][0] - t)) lo--;
  return H[lo];
}

// The x axis grows with the data until it spans WINDOW, so a fresh page isn't a sliver.
function range() {
  const end = H.length ? H[H.length - 1][0] : Date.now() / 1000;
  const start = H.length ? H[0][0] : end;
  return [end - Math.min(WINDOW, Math.max(10, end - start)), end];
}

function draw(canvas) {
  const sp = sparks.get(canvas);
  if (!sp || !canvas.isConnected) return;
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w) return;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const [t0, t1] = range();
  const i0 = Math.max(0, H.findIndex(r => r[0] >= t0));
  let max = sp.max();
  if (!ok(max) || max <= 0) {
    max = 0;
    for (let i = i0; i < H.length; i++) for (const s of sp.series) { const v = s.get(H[i]); if (ok(v) && v > max) max = v; }
    max = max > 0 ? max * 1.15 : 1;
  }
  const X = t => (t - t0) / (t1 - t0) * w;
  const Y = v => h - 1 - Math.min(1, Math.max(0, v / max)) * (h - 4);
  g.strokeStyle = css("--grid"); g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, h - 0.5); g.lineTo(w, h - 0.5); g.stroke();

  for (const s of sp.series) {
    const color = css(s.color);
    // Split into runs, breaking on missing values and on gaps in time.
    const runs = []; let run = [];
    for (let i = i0; i < H.length; i++) {
      const v = s.get(H[i]);
      const gap = i > i0 && H[i][0] - H[i - 1][0] > 3.5;
      if (!ok(v) || gap) { if (run.length) runs.push(run); run = []; }
      if (ok(v)) run.push([X(H[i][0]), Y(v)]);
    }
    if (run.length) runs.push(run);
    for (const r of runs) {
      if (sp.series.length === 1) {
        g.beginPath(); g.moveTo(r[0][0], h);
        for (const [x, y] of r) g.lineTo(x, y);
        g.lineTo(r[r.length - 1][0], h); g.closePath();
        g.globalAlpha = 0.16; g.fillStyle = color; g.fill(); g.globalAlpha = 1;
      }
      g.beginPath();
      r.forEach(([x, y], j) => j ? g.lineTo(x, y) : g.moveTo(x, y));
      if (r.length === 1) g.lineTo(r[0][0] + 1, r[0][1]);
      g.strokeStyle = color; g.lineWidth = 2; g.lineJoin = g.lineCap = "round"; g.stroke();
    }
  }
  if (sp.hover !== null && H.length) {
    const row = nearestRow(t0 + sp.hover * (t1 - t0));
    if (row) {
      const x = X(row[0]);
      g.strokeStyle = css("--ink-3"); g.lineWidth = 1;
      g.beginPath(); g.moveTo(Math.round(x) + 0.5, 0); g.lineTo(Math.round(x) + 0.5, h); g.stroke();
      for (const s of sp.series) {
        const v = s.get(row);
        if (!ok(v)) continue;
        g.beginPath(); g.arc(x, Y(v), 4, 0, 7);
        g.fillStyle = css(s.color); g.fill();
        g.lineWidth = 2; g.strokeStyle = css("--card"); g.stroke();
      }
    }
  }
}

function showTip(canvas, e) {
  const sp = sparks.get(canvas);
  const [t0, t1] = range();
  const row = nearestRow(t0 + sp.hover * (t1 - t0));
  if (!row) return;
  const ago = H[H.length - 1][0] - row[0];
  tip.innerHTML = `<div class="t">${clock(row[0])}${ago >= 1 ? ` · ${dur(ago)} ago` : ""}</div>` +
    sp.series.map(s => `<div class="r"><i style="background:var(${s.color})"></i>${esc(s.label)}<b>${esc(sp.fmt(s.get(row)))}</b></div>`).join("");
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY - th - 10;
  if (x + tw > innerWidth - 8) x = e.clientX - tw - 14;
  if (y < 8) y = e.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}

const drawAll = () => { for (const c of sparks.keys()) draw(c); };
addEventListener("resize", drawAll);

// ------------------------------------------------------------ host panels
const q = s => document.querySelector(s);
spark(q('[data-spark="cpu"]'), [{label: "CPU", color: "--s1", get: r => r[1]}], {max: () => 100, fmt: pct});
spark(q('[data-spark="mem"]'), [{label: "Used", color: "--s1", get: r => r[2]}], {max: () => S && S.host.mem_limit, fmt: v => bytes(v)});
spark(q('[data-spark="psi"]'), [{label: "Memory some 10s", color: "--s1", get: r => r[3]}],
  {max: () => Math.max(10, ...H.slice(-WINDOW).map(r => r[3] || 0)) * 1.1, fmt: v => ok(v) ? v.toFixed(2) + "%" : "–"});
spark(q('[data-spark="net"]'), [{label: "in", color: "--s1", get: r => r[4]}, {label: "out", color: "--s2", get: r => r[5]}], {fmt: rate});

function psiSev(full10, some10) {
  if (full10 >= 20) return "critical";
  if (full10 >= 5 || some10 >= 40) return "serious";
  if (full10 >= 1 || some10 >= 10) return "warning";
  return "good";
}
function diskSev(f) { return f >= 0.97 ? "critical" : f >= 0.9 ? "warning" : ""; }

function renderHost(s) {
  const h = s.host, n = s.node;
  // CPU
  const p = q("#p-cpu");
  set(p, "cpu", pct(h.cpu));
  set(p, "cores", `${h.cores.length}${h.cores.length !== n.ncpu_host ? ` of ${n.ncpu_host}` : ""} cores`);
  let sub = `load <b>${h.load.map(v => ok(v) ? v.toFixed(2) : "–").join(" ")}</b>`;
  if (ok(h.cg_cpu_used)) sub += ` · container <b>${h.cg_cpu_used.toFixed(1)}</b>${ok(h.cg_cpu_quota) ? ` / ${h.cg_cpu_quota.toFixed(1)}` : ""} cores`;
  html(p, "cpusub", sub);
  const grid = p.querySelector('[data-k="coregrid"]');
  if (grid.children.length !== h.cores.length)
    grid.innerHTML = h.cores.map(() => "<i><b></b></i>").join("");
  h.cores.forEach((v, i) => {
    const c = grid.children[i];
    c.firstChild.style.height = (ok(v) ? v : 0) + "%";
    c.title = `core ${i}: ${pct(v)}`;
  });
  // Memory
  const m = q("#p-mem");
  const limited = ok(h.cg_mem_max);
  html(m, "mem", `${bytes(h.mem_used)} <small>of ${bytes(h.mem_limit)}</small>`);
  set(m, "memscope", limited ? "container limit" : "host");
  const row = (lbl, used, total, sev = "") => `<div class="mrow"><span class="lbl">${lbl}</span><span class="val">${bytes(used)} / ${bytes(total)}</span>${meter(used / total, sev)}</div>`;
  let rows = "";
  if (limited) rows += row("container", h.cg_mem_cur, h.cg_mem_max, h.cg_mem_cur / h.cg_mem_max > 0.95 ? "critical" : h.cg_mem_cur / h.cg_mem_max > 0.85 ? "warning" : "");
  rows += row("host", h.mem_total - h.mem_avail, h.mem_total);
  if (h.swap_total > 0) rows += row("swap", h.swap_total - h.swap_free, h.swap_total, (h.swap_total - h.swap_free) / h.swap_total > 0.9 ? "warning" : "");
  html(m, "memrows", rows);
  // Pressure
  const ps = q("#p-psi"), P = h.psi;
  const sev = psiSev(P.memory.full[0] ?? 0, P.memory.some[0] ?? 0);
  const words = {good: "memory pressure: none", warning: "memory pressure: moderate", serious: "memory pressure: high",
                 critical: "memory pressure: severe, the host is thrashing"};
  html(ps, "psibadge", ok(P.memory.some[0]) ? badge(sev, words[sev]) : badge("neutral", "pressure info unavailable"));
  const cell = v => `<td>${ok(v) ? v.toFixed(2) : "–"}</td>`;
  html(ps, "psitable", ["cpu", "memory", "io"].map(r =>
    `<tr><td>${r}</td>${cell(P[r].some[0])}${cell(P[r].some[1])}${cell(P[r].full[0])}${cell(P[r].full[1])}</tr>`).join(""));
  // Network
  const nt = q("#p-net");
  set(nt, "rx", rate(h.net.rx)); set(nt, "tx", rate(h.net.tx));
  set(nt, "nettotal", `${bytes(h.net.rx_total)} in · ${bytes(h.net.tx_total)} out`);
  // Disks
  html(q("#p-disk"), "disks", h.disks.length ? h.disks.map(d => {
    const f = d.used / d.total, sv = diskSev(f);
    return `<div class="mrow" title="${esc(d.mount)} (${esc(d.fs)})"><span class="lbl mono">${esc(d.mount)}</span>` +
      `<span class="val">${bytes(d.avail)} free of ${bytes(d.total)}</span>${meter(f, sv)}</div>`;
  }).join("") : `<div class="empty">no disks found</div>`);
}

// ------------------------------------------------------------ GPU cards
const THROTTLE = {
  idle: ["neutral", "idle"], app_clocks: ["neutral", "app clocks"], sync_boost: ["neutral", "sync boost"],
  display_clocks: ["neutral", "display clocks"], power_cap: ["warning", "power cap"],
  sw_thermal: ["serious", "thermal (sw)"], hw_thermal: ["critical", "thermal (hw)"],
  hw_slowdown: ["critical", "hw slowdown"], power_brake: ["critical", "power brake"],
};
let gpuKey = "";

function tileHTML(k, label) {
  return `<div class="tile"><div class="k">${label}</div><div class="v num" data-k="${k}">–</div>` +
    `<div class="sub" data-k="${k}sub"></div><div data-k="${k}m"></div><canvas class="spark" data-spark="${k}"></canvas></div>`;
}
const FACTS = [
  ["clksm", "SM clock"], ["clkmem", "Memory clock"], ["pstate", "Perf state"], ["pcie", "PCIe link"], ["pcieio", "PCIe traffic"],
  ["nvlink", "NVLink"], ["ecc", "ECC since boot"], ["eccagg", "ECC lifetime"], ["remap", "Remapped rows"],
  ["fan", "Fan"], ["codec", "Encoder / decoder"], ["energy", "Energy since driver load"], ["persist", "Persistence / MIG"],
  ["hw", "Cores / memory bus"], ["vbios", "VBIOS"],
];

function buildGpus(devs) {
  for (const c of [...sparks.keys()]) if (c.closest("#gpus, #gsum")) sparks.delete(c);
  const root = q("#gpus");
  root.innerHTML = devs.map(d => `<div class="panel gpu" data-gpu="${d.index}">
    <header><h3>GPU ${d.index} · ${esc(d.short)}</h3>
      <div class="meta"><span>${esc(d.name)}</span><span>${esc(d.arch || "")}${d.cc ? ` sm_${d.cc.replace(".", "")}` : ""}</span><span>${esc(d.bus)}</span></div>
      <div class="badges" data-k="throttle"></div></header>
    <div class="tiles">${tileHTML("util", "Utilization")}${tileHTML("mem", "Memory")}${tileHTML("pow", "Power")}${tileHTML("temp", "Temperature")}</div>
    <dl class="facts">${FACTS.map(([k, l]) => `<div data-f="${k}"><dt>${l}</dt><dd data-k="f-${k}"></dd></div>`).join("")}</dl>
  </div>`).join("");
  devs.forEach(d => {
    const el = root.querySelector(`[data-gpu="${d.index}"]`), i = d.index;
    const dev = () => S && S.gpu.devices[i];
    const g = (r, k) => r[6] && r[6][i] ? r[6][i][k] : null;
    spark(el.querySelector('[data-spark="util"]'), [{label: "util", color: "--s1", get: r => g(r, 0)}], {max: () => 100, fmt: pct});
    spark(el.querySelector('[data-spark="mem"]'), [{label: "used", color: "--s1", get: r => g(r, 1)}], {max: () => dev()?.mem_total, fmt: v => bytes(v)});
    spark(el.querySelector('[data-spark="pow"]'), [{label: "power", color: "--s1", get: r => g(r, 2)}], {max: () => dev()?.power_limit, fmt: v => ok(v) ? v.toFixed(0) + " W" : "–"});
    spark(el.querySelector('[data-spark="temp"]'), [{label: "temp", color: "--s1", get: r => g(r, 3)}], {max: () => dev()?.temp_shut || 100, fmt: v => int(v, " °C")});
  });
  const sum = q("#gsum");
  sum.hidden = devs.length < 2;
  sum.innerHTML = devs.length < 2 ? "" : `
    <div class="panel"><h3>Average utilization</h3><div class="hero num" data-k="avgutil">–</div><canvas class="spark" data-spark="avgutil"></canvas></div>
    <div class="panel"><h3>Total power</h3><div class="hero num" data-k="totpow">–</div><canvas class="spark" data-spark="totpow"></canvas></div>
    <div class="panel"><h3>Total memory</h3><div class="hero num" data-k="totmem">–</div><div data-k="totmemm"></div></div>
    <div class="panel"><h3>Hottest GPU</h3><div class="hero num" data-k="hot">–</div><div class="sub" data-k="hotsub"></div></div>`;
  if (devs.length >= 2) {
    const all = (r, k) => { const v = (r[6] || []).map(x => x[k]).filter(ok); return v.length ? v : null; };
    spark(sum.querySelector('[data-spark="avgutil"]'), [{label: "avg util", color: "--s1",
      get: r => { const v = all(r, 0); return v && v.reduce((a, b) => a + b, 0) / v.length; }}], {max: () => 100, fmt: pct});
    spark(sum.querySelector('[data-spark="totpow"]'), [{label: "total", color: "--s1",
      get: r => { const v = all(r, 2); return v && v.reduce((a, b) => a + b, 0); }}],
      {max: () => S && S.gpu.devices.reduce((a, d) => a + (d.power_limit || 0), 0), fmt: v => ok(v) ? Math.round(v).toLocaleString() + " W" : "–"});
  }
}

function tempSev(d) {
  const slow = d.temp_slow;
  if (!ok(d.temp) || !ok(slow)) return "";
  return d.temp >= slow ? "critical" : d.temp >= slow - 5 ? "serious" : d.temp >= slow - 12 ? "warning" : "";
}

function fact(el, k, text, show = true) {
  const row = el.querySelector(`[data-f="${k}"]`);
  row.hidden = !show;
  if (show) html(row, `f-${k}`, text);
}

function renderGpus(s) {
  const G = s.gpu, devs = G.devices;
  const key = devs.map(d => d.index + d.name + d.bus).join("|");
  if (key !== gpuKey) { gpuKey = key; buildGpus(devs); }
  q("#gpu-h").textContent = devs.length ? `GPUs · ${s.node.gpu_tag}` : "GPUs";
  if (!devs.length) {
    q("#gpus").innerHTML = `<div class="panel empty">${G.loaded ? "NVML is loaded but reports no GPUs." : esc(G.error || "No NVIDIA driver found.")}</div>`;
    gpuKey = "none";
    return;
  }
  q("#gpus").classList.toggle("stale", !G.fresh);
  for (const d of devs) {
    const el = q(`[data-gpu="${d.index}"]`);
    if (!el) continue;
    // tiles
    set(el, "util", pct(d.util));
    html(el, "utilsub", `memory controller <b>${pct(d.mem_util)}</b>`);
    html(el, "utilm", meter(d.util / 100));
    html(el, "mem", `${bytes(d.mem_used)}`);
    html(el, "memsub", `of <b>${bytes(d.mem_total, 0)}</b> · ${pct(100 * d.mem_used / d.mem_total)}`);
    html(el, "memm", meter(d.mem_used / d.mem_total));
    html(el, "pow", ok(d.power) ? `${Math.round(d.power).toLocaleString()}<small> W</small>` : "–");
    html(el, "powsub", `limit <b>${int(d.power_limit, " W")}</b>${ok(d.power_max) && d.power_max !== d.power_limit ? ` (max ${int(d.power_max)})` : ""}`);
    html(el, "powm", meter(d.power / d.power_limit, d.throttle?.includes("power_brake") ? "critical" : ""));
    const ts = tempSev(d);
    html(el, "temp", ok(d.temp) ? `${d.temp}<small> °C</small>` : "–");
    html(el, "tempsub", ok(d.temp_slow) ? `slowdown at <b>${d.temp_slow} °C</b>` : "");
    html(el, "tempm", meter(d.temp / (d.temp_shut || d.temp_slow + 10 || 100), ts));
    // throttle badges
    const th = (d.throttle || []).map(k => THROTTLE[k] || ["neutral", k]);
    html(el, "throttle", d.throttle === null ? "" :
      (th.length ? th : [["good", "not throttled"]]).map(([sv, l]) => badge(sv, l)).join("") +
      (ts ? badge(ts, ts === "critical" ? "at slowdown temp" : "running hot") : ""));
    // facts
    fact(el, "clksm", `${int(d.clk_sm)} / ${int(d.clk_sm_max)} MHz`, ok(d.clk_sm));
    fact(el, "clkmem", `${int(d.clk_mem)} / ${int(d.clk_mem_max)} MHz`, ok(d.clk_mem));
    fact(el, "pstate", ok(d.pstate) ? `P${d.pstate}` : "", ok(d.pstate));
    const narrow = ok(d.pcie_width) && ok(d.pcie_width_max) && d.pcie_width < d.pcie_width_max;
    fact(el, "pcie", `${narrow ? badge("warning", "narrow link") + " " : ""}Gen${d.pcie_gen ?? "?"} x${d.pcie_width ?? "?"}` +
      ` <span style="color:var(--ink-3)">(max Gen${d.pcie_gen_max ?? "?"} x${d.pcie_width_max ?? "?"})</span>`, ok(d.pcie_gen));
    fact(el, "pcieio", `${rate(d.pcie_rx)} in · ${rate(d.pcie_tx)} out`, ok(d.pcie_rx) || ok(d.pcie_tx));
    const nvDown = ok(d.nvl_total) && d.nvl_active < d.nvl_total;
    fact(el, "nvlink", `${nvDown ? badge("critical", "link down") + " " : ""}${d.nvl_active} / ${d.nvl_total} links up`, ok(d.nvl_total));
    const uncorr = d.ecc_uncorr > 0;
    fact(el, "ecc", `${uncorr ? badge("critical", "uncorrectable") + " " : ""}${int(d.ecc_corr)} corr · ${int(d.ecc_uncorr)} uncorr`, d.ecc_on === 1);
    fact(el, "eccagg", `${int(d.ecc_corr_agg)} corr · ${int(d.ecc_uncorr_agg)} uncorr`, d.ecc_on === 1 && ok(d.ecc_corr_agg));
    const rm = d.remap_fail ? badge("critical", "remap failed") + " " : d.remap_pending ? badge("warning", "reset pending") + " " : "";
    fact(el, "remap", `${rm}${int(d.remap_corr)} corr · ${int(d.remap_unc)} uncorr`, ok(d.remap_corr));
    fact(el, "fan", pct(d.fan), ok(d.fan));
    fact(el, "codec", `${pct(d.enc)} / ${pct(d.dec)}`, ok(d.enc));
    fact(el, "energy", ok(d.energy) ? `${(d.energy / 3.6e6).toFixed(2)} kWh` : "", ok(d.energy));
    fact(el, "persist", `${d.persist ? "on" : "off"} / ${ok(d.mig) ? (d.mig ? "on" : "off") : "n/a"}`, ok(d.persist));
    fact(el, "hw", `${int(d.cores)} / ${int(d.bus_width, "-bit")}`, ok(d.cores) || ok(d.bus_width));
    fact(el, "vbios", esc(d.vbios), !!d.vbios);
  }
  if (devs.length >= 2) {
    const sum = q("#gsum"), f = devs.filter(d => ok(d.util));
    set(sum, "avgutil", f.length ? pct(f.reduce((a, d) => a + d.util, 0) / f.length) : "–");
    const tp = devs.reduce((a, d) => a + (d.power || 0), 0), tl = devs.reduce((a, d) => a + (d.power_limit || 0), 0);
    html(sum, "totpow", `${Math.round(tp).toLocaleString()}<small> / ${Math.round(tl).toLocaleString()} W</small>`);
    const mu = devs.reduce((a, d) => a + (d.mem_used || 0), 0), mt = devs.reduce((a, d) => a + (d.mem_total || 0), 0);
    html(sum, "totmem", `${bytes(mu)}<small> of ${bytes(mt, 0)}</small>`);
    html(sum, "totmemm", meter(mu / mt));
    const hot = devs.reduce((a, d) => (d.temp ?? -1) > (a.temp ?? -1) ? d : a, devs[0]);
    html(sum, "hot", ok(hot.temp) ? `${hot.temp}<small> °C</small>` : "–");
    html(sum, "hotsub", `GPU ${hot.index}${ok(hot.temp_slow) ? ` · slowdown at <b>${hot.temp_slow} °C</b>` : ""}`);
  }
}

// ------------------------------------------------------------ header
function renderHeader(s) {
  const n = s.node;
  q("#name").textContent = n.name;
  const parts = [`up <b>${dur(s.host.uptime)}</b>`];
  if (n.os) parts.push(esc(n.os));
  if (n.kernel) parts.push(esc(n.kernel));
  if (n.driver) parts.push(`driver <b>${esc(n.driver)}</b>`);
  if (n.cuda) parts.push(`CUDA <b>${esc(n.cuda)}</b>`);
  if (n.cpu_model) parts.push(esc(n.cpu_model));
  const meta = q("#meta"), h = parts.map(p => `<span>${p}</span>`).join("");
  if (meta._h !== h) { meta.innerHTML = h; meta._h = h; }
  const G = s.gpu, b = q("#banner");
  let msg = "", sev = "";
  if (G.loaded && !G.fresh && G.devices.length) {
    msg = `GPU data is ${dur(G.age)} old: NVML has stopped answering, which usually means the NVIDIA driver is stuck. ` +
          `GPU jobs may be blocked too. Avoid running nvidia-smi on this node.`;
    sev = "critical";
  }
  if (b.textContent !== msg) b.textContent = msg;
  b.dataset.sev = sev;
  const util = G.devices.filter(d => ok(d.util));
  document.title = n.name + (util.length ? ` · ${Math.round(util.reduce((a, d) => a + d.util, 0) / util.length)}%` : "");
}

// ------------------------------------------------------------ data flow
function push(row) {
  if (!row) return;
  if (H.length && row[0] <= H[H.length - 1][0]) return;
  H.push(row);
  const cut = row[0] - WINDOW - 5;
  while (H.length && H[0][0] < cut) H.shift();
}

function render(s) {
  S = s;
  push(s.row);
  renderHeader(s);
  renderHost(s);
  renderGpus(s);
  drawAll();
}

function live(state, text) {
  const l = q("#live");
  l.dataset.s = state;
  l.lastChild.textContent = text;
}

async function loadHistory() {
  try {
    const rows = await (await fetch("api/history")).json();
    const all = rows.concat(H).sort((a, b) => a[0] - b[0]);
    H.length = 0;
    for (const r of all) push(r);
    drawAll();
  } catch (e) { /* history is optional */ }
}

function connect() {
  const es = new EventSource("api/events");
  let watchdog;
  const arm = () => { clearTimeout(watchdog); watchdog = setTimeout(() => live("down", "no data"), 5000); };
  es.onopen = () => { live("live", "live"); loadHistory(); arm(); };
  es.onmessage = e => { live("live", "live"); arm(); render(JSON.parse(e.data)); };
  es.onerror = () => live("down", "reconnecting");
}
connect();
</script>
</body>
</html>
