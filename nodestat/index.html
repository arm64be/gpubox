<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>nodestat</title>
<link rel="icon" id="favicon" href="data:,">
<style>
@font-face {
  font-family: "Obel Mono";
  font-style: normal;
  font-weight: 100 900;
  font-display: block;
  src: url("font.woff2") format("woff2");
}
/* Catppuccin Mocha */
:root {
  --crust: #11111b; --mantle: #181825; --base: #1e1e2e;
  --surface0: #313244; --surface1: #45475a; --surface2: #585b70;
  --overlay0: #6c7086; --overlay1: #7f849c; --subtext0: #a6adc8; --text: #cdd6f4;
  --mauve: #cba6f7; --teal: #94e2d5;
  --green: #a6e3a1; --yellow: #f9e2af; --peach: #fab387; --red: #f38ba8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--base); }
body {
  margin: 0; color: var(--text); background: var(--base);
  font: 400 14px/20px "Obel Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}
.k { color: var(--overlay1); }
.dim { color: var(--overlay0); }

/* dithered rules: a 1px checkerboard */
.rule { height: 2px; background: repeating-conic-gradient(var(--surface2) 0 25%, transparent 0 50%) 0 0 / 2px 2px; }

.page { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 100vh; }
@media (max-width: 1100px) { .page { grid-template-columns: minmax(0, 1fr); } }
.main { padding: 28px 36px 64px; min-width: 0; }

/* ---------------------------------------------------------------- header */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 0 24px; }
.top h1 { margin: 0; font-size: 56px; line-height: 60px; font-weight: 200; letter-spacing: -0.02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live { white-space: nowrap; padding-bottom: 10px; color: var(--subtext0); }
.live::before { content: "■"; margin-right: 1ch; color: var(--overlay0); }
.live[data-s=live]::before { color: var(--green); }
.live[data-s=down]::before { color: var(--red); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 3ch; margin: 10px 0 22px; color: var(--text); min-height: 20px; }
.meta span { white-space: nowrap; }

/* ------------------------------------------------------------ gpu overview */
.overview { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 32px; align-items: end; padding: 18px 0; }
.overview h2 { margin: 0 0 6px; font-size: 18px; line-height: 24px; font-weight: 600; }
.agg { display: flex; flex-wrap: wrap; gap: 4px 3ch; }
.agg span { white-space: nowrap; }
.bars { display: flex; flex-direction: column; align-items: stretch; }
.bars canvas { display: block; image-rendering: pixelated; }
.bars .idx { display: flex; color: var(--overlay0); font-size: 12px; line-height: 16px; }
.bars .idx span { text-align: center; }
.notice { min-height: 20px; grid-column: 1 / -1; }
.notice:empty { display: none; }

/* ----------------------------------------------------------------- gpu block */
.gpu { padding: 22px 0 24px; }
.gpu.stale { opacity: .5; }
.ghead { display: flex; align-items: baseline; gap: 2ch; height: 24px; white-space: nowrap; overflow: hidden; margin-bottom: 14px; }
.ghead h3 { margin: 0; font-size: 18px; font-weight: 600; color: var(--mauve); }
.ghead .model { font-size: 18px; font-weight: 500; }
.flags { margin-left: auto; display: flex; gap: 2ch; }
.flag::before { margin-right: 1ch; }
.flag[data-sev=good]::before { content: "✓"; color: var(--green); }
.flag[data-sev=neutral]::before { content: "·"; color: var(--overlay1); }
.flag[data-sev=warning]::before { content: "▲"; color: var(--yellow); }
.flag[data-sev=serious]::before { content: "▲"; color: var(--peach); }
.flag[data-sev=critical]::before { content: "✕"; color: var(--red); }

.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 28px; }
@media (max-width: 760px) {
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
  .main { padding: 20px 16px 48px; }
  .top h1 { font-size: 36px; line-height: 44px; }
  .ghead { height: auto; flex-wrap: wrap; row-gap: 4px; }
  .flags { margin-left: 0; flex-basis: 100%; flex-wrap: wrap; }
  .overview { grid-template-columns: minmax(0, 1fr); }
}
.metric .v { font-size: 24px; line-height: 32px; height: 32px; font-weight: 500; white-space: nowrap; }
.metric .v small, .hv small { font-size: 14px; line-height: 1; font-weight: 400; color: var(--subtext0); }
.metric .s { color: var(--subtext0); font-size: 12px; line-height: 16px; height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.graph { position: relative; height: 56px; margin-top: 10px; cursor: crosshair; }
.graph.short { height: 40px; }
.graph.tall { height: 72px; }
.graph canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; }

.meter { height: 6px; margin-top: 8px; background: repeating-conic-gradient(var(--surface1) 0 25%, transparent 0 50%) 0 0 / 2px 2px; }
.meter i { display: block; height: 100%; width: 0; background: var(--mauve); }
.meter[data-sev=warning] i { background: var(--yellow); }
.meter[data-sev=serious] i { background: var(--peach); }
.meter[data-sev=critical] i { background: var(--red); }

.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 28px; margin-top: 18px; }
@media (max-width: 1400px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .facts { grid-template-columns: minmax(0, 1fr); } }
.facts div { display: flex; justify-content: space-between; gap: 2ch; height: 24px; align-items: center; font-size: 13px; min-width: 0; }
.facts dt { color: var(--overlay1); white-space: nowrap; }
.facts dd { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.facts dd.na { color: var(--overlay0); }

.empty { padding: 24px 0; color: var(--subtext0); }

/* --------------------------------------------------------------- host rail */
.rail { position: relative; background: var(--mantle); }
.rail::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: repeating-conic-gradient(var(--surface1) 0 25%, transparent 0 50%) 0 0 / 2px 2px; }
.rail-in { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 32px 28px 40px 30px; }
@media (max-width: 1100px) { .rail::before { display: none; } .rail-in { position: static; max-height: none; } }
.hs + .hs { margin-top: 26px; }
.hs h2 { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 6px; font-size: 14px; font-weight: 600; }
.hs h2 span { font-weight: 400; color: var(--overlay1); font-size: 12px; }
.hv { font-size: 24px; line-height: 32px; height: 32px; font-weight: 500; white-space: nowrap; }
.hsub { color: var(--subtext0); font-size: 12px; line-height: 16px; min-height: 16px; }
.mrow { margin-top: 10px; }
.mrow .l { display: flex; justify-content: space-between; gap: 2ch; font-size: 13px; }
.mrow .l span:first-child { color: var(--overlay1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .l span:last-child { white-space: nowrap; }
.cores { position: relative; height: 32px; margin-top: 10px; }
.cores canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
table.psi { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
table.psi th { color: var(--overlay1); font-weight: 400; text-align: right; font-size: 12px; line-height: 16px; }
table.psi th[colspan] { text-align: center; }
table.psi td { text-align: right; height: 22px; }
table.psi td:first-child, table.psi th:first-child { text-align: left; color: var(--overlay1); }
.legend { display: flex; gap: 3ch; font-size: 12px; color: var(--subtext0); margin-top: 6px; }
.legend i { display: inline-block; width: 8px; height: 8px; margin-right: 1ch; vertical-align: 0;
  background: repeating-conic-gradient(currentColor 0 25%, transparent 0 50%) 0 0 / 2px 2px; }
.foot { margin-top: 32px; font-size: 12px; color: var(--overlay0); }
.foot a { color: var(--overlay1); }

#tip { position: fixed; z-index: 10; pointer-events: none; display: none; white-space: nowrap;
  background: var(--crust); border: 1px solid var(--surface1); padding: 6px 10px; font-size: 12px; line-height: 18px; }
#tip .r { display: flex; gap: 3ch; justify-content: space-between; }
#tip .r b { font-weight: 500; }
</style>
</head>
<body>
<div class="page">
  <div class="main">
    <div class="top">
      <h1 id="name">&nbsp;</h1>
      <div class="live" id="live" data-s="wait">connecting</div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="rule"></div>
    <div class="overview" id="overview">
      <div><h2 id="gtitle">gpus</h2><div class="agg" id="agg"></div></div>
      <div class="bars" id="bars"></div>
      <div class="notice" id="notice"></div>
    </div>
    <div id="gpus"></div>
  </div>

  <aside class="rail"><div class="rail-in">
    <section class="hs" id="h-cpu">
      <h2>cpu <span data-k="cores"></span></h2>
      <div class="hv" data-k="cpu">&nbsp;</div>
      <div class="hsub" data-k="cpusub"></div>
      <div class="cores" data-k="coregrid"><canvas></canvas></div>
      <div class="graph short" data-graph="cpu"></div>
    </section>
    <section class="hs" id="h-mem">
      <h2>memory <span data-k="memscope"></span></h2>
      <div class="hv" data-k="mem">&nbsp;</div>
      <div data-k="memrows"></div>
      <div class="graph short" data-graph="mem"></div>
    </section>
    <section class="hs" id="h-psi">
      <h2>pressure <span>% of time stalled</span></h2>
      <div class="flag" data-k="psiflag" data-sev="neutral">&nbsp;</div>
      <table class="psi">
        <thead><tr><th></th><th colspan="2">some</th><th colspan="2">full</th></tr>
               <tr><th></th><th>10s</th><th>60s</th><th>10s</th><th>60s</th></tr></thead>
        <tbody data-k="psitable"></tbody>
      </table>
    </section>
    <section class="hs" id="h-net">
      <h2>network <span data-k="nettotal"></span></h2>
      <div class="hv"><span data-k="rx">&nbsp;</span> <small>in</small></div>
      <div class="hsub"><span data-k="tx"></span> out</div>
      <div class="graph tall" data-graph="net"></div>
      <div class="legend"><span style="color:var(--mauve)"><i></i>in, drawn up</span><span style="color:var(--teal)"><i></i>out, drawn down</span></div>
    </section>
    <section class="hs" id="h-disk">
      <h2>disks</h2>
      <div data-k="disks"></div>
    </section>
    <div class="foot">set in Obel Mono (<a href="font-license.txt">OFL</a>)</div>
  </div></aside>
</div>
<div id="tip"></div>

<script>
"use strict";
const WINDOW = 900;   // seconds of history drawn
const H = [];         // rows: [t, cpu, mem, psi, rx, tx, [[util, mem, W, °C, MHz], ...]]
let S = null;         // latest snapshot

// ------------------------------------------------------------ formatting
const ok = v => typeof v === "number" && Number.isFinite(v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function bytes(v, digits = 1) {
  if (!ok(v)) return "n/a";
  const u = ["B", "KiB", "MiB", "GiB", "TiB", "PiB"];
  let i = 0;
  while (Math.abs(v) >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v.toFixed(0) : v.toFixed(v >= 100 ? 0 : digits)) + " " + u[i];
}
const rate = v => ok(v) ? bytes(v) + "/s" : "n/a";
const pct = v => ok(v) ? Math.round(v) + "%" : "n/a";
const int = (v, unit = "") => ok(v) ? Math.round(v).toLocaleString("en") + unit : "n/a";
function dur(s) {
  if (!ok(s)) return "n/a";
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m ${Math.floor(s % 60)}s` : `${Math.floor(s)}s`;
}
const clock = t => new Date(t * 1000).toLocaleTimeString([], {hour12: false});
const kv = (k, v) => `<span><span class="k">${k}</span> ${v}</span>`;

const $ = (s, r = document) => r.querySelector(s);
function set(root, k, text) {
  const el = root.querySelector(`[data-k="${k}"]`);
  if (el && el.textContent !== text) el.textContent = text;
}
function setHTML(el, h) {
  if (el && el._h !== h) { el.innerHTML = h; el._h = h; }
}
const html = (root, k, h) => setHTML(root.querySelector(`[data-k="${k}"]`), h);
function meter(frac, sev = "") {
  const w = ok(frac) ? Math.max(0, Math.min(1, frac)) * 100 : 0;
  return `<div class="meter"${sev ? ` data-sev="${sev}"` : ""}><i style="width:${w.toFixed(1)}%"></i></div>`;
}
const flag = (sev, label) => `<span class="flag" data-sev="${sev}">${esc(label)}</span>`;

// ------------------------------------------------------------ colors
const COLORS = {};
function rgb(name) {
  if (!COLORS[name]) {
    const hex = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    COLORS[name] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  }
  return COLORS[name];
}

// ------------------------------------------------------------ dithering
// 4x4 Bayer thresholds in (0, 1).
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];

// One dither pixel is this many CSS px, chosen so it lands on whole device pixels.
function pixelSize() {
  const dpr = window.devicePixelRatio || 1;
  return Math.max(1, Math.round(2 * dpr)) / dpr;
}

// Sizes a canvas inside its box to whole dither pixels; returns [ctx, W, H].
function fit(box, canvas) {
  const P = pixelSize();
  const W = Math.max(1, Math.floor(box.clientWidth / P)), Hh = Math.max(1, Math.floor(box.clientHeight / P));
  if (canvas.width !== W || canvas.height !== Hh) {
    canvas.width = W; canvas.height = Hh;
    canvas.style.width = W * P + "px"; canvas.style.height = Hh * P + "px";
  }
  return [canvas.getContext("2d"), W, Hh];
}

function put(d, W, x, y, c) {
  const i = (y * W + x) * 4;
  d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
}

// Fills one column from `top` towards `bottom` (inclusive): solid at the top
// edge, then ordered dither that thins out with depth.
function ditherColumn(d, W, x, top, bottom, span, c) {
  const step = bottom >= top ? 1 : -1;
  for (let y = top; step > 0 ? y <= bottom : y >= bottom; y += step) {
    const depth = Math.abs(y - top);
    const density = depth === 0 ? 1 : Math.max(0.12, 0.78 - 0.9 * depth / span);
    if (bayer(x, y) < density) put(d, W, x, y, c);
  }
}

// ------------------------------------------------------------ graphs
const graphs = new Map();   // box element -> spec
const tip = $("#tip");

function graph(box, series, opt = {}) {
  let canvas = box.querySelector("canvas");
  if (!canvas) { canvas = document.createElement("canvas"); box.appendChild(canvas); }
  const g = {box, canvas, series, mirror: !!opt.mirror, max: opt.max || (() => null),
             fmt: opt.fmt || String, hover: null};
  graphs.set(box, g);
  box.onmousemove = e => {
    const r = box.getBoundingClientRect();
    g.hover = (e.clientX - r.left) / r.width;
    draw(g); showTip(g, e);
  };
  box.onmouseleave = () => { g.hover = null; tip.style.display = "none"; draw(g); };
}

// The x axis grows with the data until it spans WINDOW, so a new page isn't a sliver.
function range() {
  const end = H.length ? H[H.length - 1][0] : Date.now() / 1000;
  const start = H.length ? H[0][0] : end;
  return [end - Math.min(WINDOW, Math.max(10, end - start)), end];
}

function firstAtOrAfter(t) {
  let lo = 0, hi = H.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (H[m][0] < t) lo = m + 1; else hi = m; }
  return lo;
}

function nearestRow(t) {
  if (!H.length) return null;
  let i = Math.min(firstAtOrAfter(t), H.length - 1);
  if (i > 0 && Math.abs(H[i - 1][0] - t) < Math.abs(H[i][0] - t)) i--;
  return H[i];
}

// Per-column values: the max of the samples inside each column's time slice,
// or the nearest sample within 1.6 s when columns are finer than samples.
function columns(get, W, t0, t1) {
  const out = new Float64Array(W).fill(NaN), dt = (t1 - t0) / W;
  for (let x = 0; x < W; x++) {
    const a = t0 + x * dt, b = a + dt;
    let m = NaN;
    for (let i = firstAtOrAfter(a); i < H.length && H[i][0] < b; i++) {
      const v = get(H[i]);
      if (ok(v) && !(v <= m)) m = v;
    }
    if (!ok(m)) {
      const r = nearestRow(a + dt / 2);
      if (r && Math.abs(r[0] - (a + dt / 2)) < 1.6) { const v = get(r); if (ok(v)) m = v; }
    }
    out[x] = m;
  }
  return out;
}

function draw(g) {
  if (!g.box.isConnected) return;
  const [ctx, W, Hh] = fit(g.box, g.canvas);
  const img = ctx.createImageData(W, Hh), d = img.data;
  const [t0, t1] = range();
  const cols = g.series.map(s => columns(s.get, W, t0, t1));
  let max = g.max();
  if (!ok(max) || max <= 0) {
    max = 0;
    for (const c of cols) for (const v of c) if (v > max) max = v;
    max = max > 0 ? max * 1.15 : 1;
  }
  const base = rgb("--surface1");
  if (g.mirror) {
    // the first series grows up from the middle, the second down from it
    const mid = Math.floor(Hh / 2), half = mid;
    for (let x = 0; x < W; x += 2) put(d, W, x, mid, base);
    g.series.forEach((s, k) => {
      const c = rgb(s.color);
      for (let x = 0; x < W; x++) {
        const v = cols[k][x];
        if (!ok(v)) continue;
        const h = Math.round(Math.min(1, v / max) * (half - 1));
        if (h <= 0) continue;
        if (k === 0) ditherColumn(d, W, x, mid - h, mid - 1, half, c);
        else ditherColumn(d, W, x, mid + h, mid + 1, half, c);
      }
    });
  } else {
    for (let x = 0; x < W; x += 2) put(d, W, x, Hh - 1, base);
    g.series.forEach((s, k) => {
      const c = rgb(s.color);
      for (let x = 0; x < W; x++) {
        const v = cols[k][x];
        if (!ok(v)) continue;
        const top = Hh - 1 - Math.round(Math.min(1, Math.max(0, v / max)) * (Hh - 1));
        ditherColumn(d, W, x, top, Hh - 1, Hh, c);
      }
    });
  }
  if (g.hover !== null) {
    const x = Math.min(W - 1, Math.max(0, Math.floor(g.hover * W))), c = rgb("--text");
    for (let y = 0; y < Hh; y += 2) put(d, W, x, y, c);
  }
  ctx.putImageData(img, 0, 0);
}

function showTip(g, e) {
  const [t0, t1] = range();
  const row = nearestRow(t0 + g.hover * (t1 - t0));
  if (!row) return;
  const ago = H[H.length - 1][0] - row[0];
  tip.innerHTML = `<div class="k">${clock(row[0])}${ago >= 1 ? `, ${dur(ago)} ago` : ""}</div>` +
    g.series.map(s => `<div class="r"><span>${esc(s.label)}</span><b>${esc(g.fmt(s.get(row)))}</b></div>`).join("");
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY - th - 10;
  if (x + tw > innerWidth - 8) x = e.clientX - tw - 14;
  if (y < 8) y = e.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}

// Vertical dithered bars, one per item: CPU cores and the GPU overview.
function bars(box, canvas, values, color, gap = 1) {
  const [ctx, W, Hh] = fit(box, canvas);
  const img = ctx.createImageData(W, Hh), d = img.data, n = values.length;
  if (n) {
    const perRow = Math.min(n, Math.max(1, Math.floor((W + gap) / (2 + gap))));
    const rows = Math.ceil(n / perRow), cw = Math.floor((W + gap) / perRow) - gap;
    const rh = Math.floor((Hh - (rows - 1) * 2) / rows);
    const c = rgb(color), base = rgb("--surface1");
    values.forEach((v, i) => {
      const x0 = (i % perRow) * (cw + gap), y1 = Math.floor(i / perRow) * (rh + 2) + rh - 1;
      const h = ok(v) ? Math.round(Math.min(1, Math.max(0, v)) * rh) : 0;
      for (let x = x0; x < x0 + cw; x++) {
        if ((x + y1) % 2 === 0) put(d, W, x, y1, base);
        if (h > 0) ditherColumn(d, W, x, y1 - h + 1, y1, rh, c);
      }
    });
  }
  ctx.putImageData(img, 0, 0);
}

// ------------------------------------------------------------ favicon
// A 16x16 chip whose die fills with dithered mauve as average GPU load rises.
const fav = document.createElement("canvas");
fav.width = fav.height = 32;
let favKey = "";
function favicon(load, sev) {
  const key = Math.round(load * 6) + sev;
  if (key === favKey) return;
  favKey = key;
  const img = new ImageData(16, 16), d = img.data;
  const pin = rgb("--overlay1"), edge = rgb("--surface2"), body = rgb("--crust");
  const die = rgb(sev === "critical" ? "--red" : "--mauve");
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const pinX = (y === 5 || y === 8 || y === 10) && (x === 1 || x === 2 || x === 13 || x === 14);
    const pinY = (x === 5 || x === 8 || x === 10) && (y === 1 || y === 2 || y === 13 || y === 14);
    if (pinX || pinY) { put(d, 16, x, y, pin); continue; }
    if (x < 3 || x > 12 || y < 3 || y > 12) continue;
    if (x === 3 || x === 12 || y === 3 || y === 12) { put(d, 16, x, y, edge); continue; }
    // rows 4..11 of the die: filled from the bottom with load, a sparse dither above
    const level = 12 - y;                     // 1 at the bottom .. 8 at the top
    const filled = level <= Math.max(1, Math.round(load * 8));
    put(d, 16, x, y, bayer(x, y) < (filled ? 0.85 : 0.13) ? die : body);
  }
  const t = document.createElement("canvas");
  t.width = t.height = 16;
  t.getContext("2d").putImageData(img, 0, 0);
  const g = fav.getContext("2d");
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, 32, 32);
  g.drawImage(t, 0, 0, 32, 32);
  $("#favicon").href = fav.toDataURL("image/png");
}

// ------------------------------------------------------------ host rail
graph($('[data-graph="cpu"]'), [{label: "cpu", color: "--mauve", get: r => r[1]}], {max: () => 100, fmt: pct});
graph($('[data-graph="mem"]'), [{label: "used", color: "--mauve", get: r => r[2]}], {max: () => S && S.host.mem_limit, fmt: v => bytes(v)});
graph($('[data-graph="net"]'), [{label: "in", color: "--mauve", get: r => r[4]}, {label: "out", color: "--teal", get: r => r[5]}],
      {mirror: true, fmt: rate});

function psiSev(full10, some10) {
  if (full10 >= 20) return "critical";
  if (full10 >= 5 || some10 >= 40) return "serious";
  if (full10 >= 1 || some10 >= 10) return "warning";
  return "good";
}

function renderHost(s) {
  const h = s.host, n = s.node;
  const c = $("#h-cpu");
  set(c, "cpu", pct(h.cpu));
  set(c, "cores", h.cores.length === n.ncpu_host ? `${h.cores.length} cores` : `${h.cores.length} of ${n.ncpu_host} cores`);
  let sub = `<span class="k">load</span> ${h.load.map(v => ok(v) ? v.toFixed(2) : "n/a").join(" ")}`;
  if (ok(h.cg_cpu_used)) sub += `&nbsp;&nbsp;<span class="k">container</span> ${h.cg_cpu_used.toFixed(1)}${ok(h.cg_cpu_quota) ? ` of ${h.cg_cpu_quota.toFixed(1)}` : ""} cores`;
  html(c, "cpusub", sub);
  const cg = c.querySelector('[data-k="coregrid"]');
  bars(cg, cg.firstChild, h.cores.map(v => ok(v) ? v / 100 : null), "--mauve");

  const m = $("#h-mem"), limited = ok(h.cg_mem_max);
  html(m, "mem", `${bytes(h.mem_used)} <small>of ${bytes(h.mem_limit)}</small>`);
  set(m, "memscope", limited ? "container limit" : "whole host");
  const row = (lbl, used, total, sev = "") =>
    `<div class="mrow"><div class="l"><span>${lbl}</span><span>${bytes(used)} / ${bytes(total)}</span></div>${meter(used / total, sev)}</div>`;
  let rows = "";
  if (limited) {
    const f = h.cg_mem_cur / h.cg_mem_max;
    rows += row("container", h.cg_mem_cur, h.cg_mem_max, f > 0.95 ? "critical" : f > 0.85 ? "warning" : "");
  }
  rows += row("host", h.mem_total - h.mem_avail, h.mem_total);
  if (h.swap_total > 0) rows += row("swap", h.swap_total - h.swap_free, h.swap_total);
  html(m, "memrows", rows);

  const p = $("#h-psi"), P = h.psi, fl = p.querySelector('[data-k="psiflag"]');
  const sev = ok(P.memory.some[0]) ? psiSev(P.memory.full[0] ?? 0, P.memory.some[0] ?? 0) : "neutral";
  const words = {good: "no memory pressure", warning: "some memory pressure", serious: "high memory pressure",
                 critical: "severe memory pressure, the host is thrashing", neutral: "pressure info unavailable"};
  fl.dataset.sev = sev;
  if (fl.textContent !== words[sev]) fl.textContent = words[sev];
  const cell = v => `<td>${ok(v) ? v.toFixed(2) : "n/a"}</td>`;
  html(p, "psitable", ["cpu", "memory", "io"].map(r =>
    `<tr><td>${r}</td>${cell(P[r].some[0])}${cell(P[r].some[1])}${cell(P[r].full[0])}${cell(P[r].full[1])}</tr>`).join(""));

  const nt = $("#h-net");
  set(nt, "rx", rate(h.net.rx));
  set(nt, "tx", rate(h.net.tx));
  set(nt, "nettotal", `${bytes(h.net.rx_total)} in, ${bytes(h.net.tx_total)} out`);

  html($("#h-disk"), "disks", h.disks.length ? h.disks.map(d => {
    const f = d.used / d.total;
    return `<div class="mrow" title="${esc(d.mount)} (${esc(d.fs)})"><div class="l"><span>${esc(d.mount)}</span>` +
      `<span>${bytes(d.avail)} free of ${bytes(d.total)}</span></div>${meter(f, f >= 0.97 ? "critical" : f >= 0.9 ? "warning" : "")}</div>`;
  }).join("") : `<div class="dim">no disks found</div>`);
}

// ------------------------------------------------------------ gpus
const THROTTLE = {
  idle: ["neutral", "idle"], app_clocks: ["neutral", "app clocks"], sync_boost: ["neutral", "sync boost"],
  display_clocks: ["neutral", "display clocks"], power_cap: ["warning", "power capped"],
  sw_thermal: ["serious", "thermal slowdown"], hw_thermal: ["critical", "hardware thermal slowdown"],
  hw_slowdown: ["critical", "hardware slowdown"], power_brake: ["critical", "power brake"],
};
// A fixed set and order of facts, so every GPU block has the same height.
const FACTS = [
  ["clksm", "sm clock"], ["clkmem", "memory clock"], ["pstate", "perf state"],
  ["pcie", "pcie link"], ["pciein", "pcie in"], ["pcieout", "pcie out"],
  ["nvlink", "nvlink"], ["ecc", "ecc since boot"], ["eccagg", "ecc lifetime"],
  ["remap", "remapped rows"], ["fan", "fan"], ["codec", "enc / dec"],
  ["energy", "energy used"], ["persist", "persistence"], ["mig", "mig"],
  ["cores", "cuda cores"], ["bus", "memory bus"], ["vbios", "vbios"],
];
let gpuKey = "";

function metricHTML(k, label) {
  return `<div class="metric"><div class="k">${label}</div><div class="v" data-k="${k}">&nbsp;</div>` +
    `<div class="s" data-k="${k}s"></div><div data-k="${k}m">${meter(0)}</div><div class="graph" data-graph="${k}"></div></div>`;
}

function buildGpus(devs) {
  for (const b of [...graphs.keys()]) if (b.closest("#gpus")) graphs.delete(b);
  const root = $("#gpus");
  root.innerHTML = devs.map(d => `<div class="rule"></div><div class="gpu" data-gpu="${d.index}">
    <div class="ghead"><h3>gpu ${d.index}</h3><span class="model">${esc(d.short)}</span>
      <span class="k">${esc((d.arch || "").toLowerCase())}${d.cc ? ` sm_${d.cc.replace(".", "")}` : ""}</span>
      <span class="dim">${esc(d.bus.replace(/^0000/, ""))}</span>
      <span class="flags" data-k="flags"></span></div>
    <div class="metrics">${metricHTML("util", "utilization")}${metricHTML("mem", "memory")}${metricHTML("pow", "power")}${metricHTML("temp", "temperature")}</div>
    <dl class="facts">${FACTS.map(([k, l]) => `<div><dt>${l}</dt><dd data-k="f-${k}">&nbsp;</dd></div>`).join("")}</dl>
  </div>`).join("");
  devs.forEach(d => {
    const el = root.querySelector(`[data-gpu="${d.index}"]`), i = d.index;
    const dev = () => S && S.gpu.devices[i];
    const g = (r, k) => r[6] && r[6][i] ? r[6][i][k] : null;
    graph(el.querySelector('[data-graph="util"]'), [{label: "utilization", color: "--mauve", get: r => g(r, 0)}], {max: () => 100, fmt: pct});
    graph(el.querySelector('[data-graph="mem"]'), [{label: "used", color: "--mauve", get: r => g(r, 1)}], {max: () => dev()?.mem_total, fmt: v => bytes(v)});
    graph(el.querySelector('[data-graph="pow"]'), [{label: "power", color: "--mauve", get: r => g(r, 2)}], {max: () => dev()?.power_limit, fmt: v => int(v, " W")});
    graph(el.querySelector('[data-graph="temp"]'), [{label: "temperature", color: "--mauve", get: r => g(r, 3)}], {max: () => dev()?.temp_shut || 100, fmt: v => int(v, " °C")});
  });
}

function tempSev(d) {
  const slow = d.temp_slow;
  if (!ok(d.temp) || !ok(slow)) return "";
  return d.temp >= slow ? "critical" : d.temp >= slow - 5 ? "serious" : d.temp >= slow - 12 ? "warning" : "";
}

function fact(el, k, value, show = true) {
  const dd = el.querySelector(`[data-k="f-${k}"]`);
  setHTML(dd, show ? value : "n/a");
  dd.classList.toggle("na", !show);
}

function renderGpu(el, d) {
  set(el, "util", pct(d.util));
  html(el, "utils", `<span class="k">memory controller</span> ${pct(d.mem_util)}`);
  html(el, "utilm", meter(d.util / 100));
  set(el, "mem", bytes(d.mem_used));
  html(el, "mems", `<span class="k">of</span> ${bytes(d.mem_total, 0)}, ${pct(100 * d.mem_used / d.mem_total)}`);
  html(el, "memm", meter(d.mem_used / d.mem_total));
  html(el, "pow", ok(d.power) ? `${int(d.power)}<small> W</small>` : "n/a");
  html(el, "pows", `<span class="k">limit</span> ${int(d.power_limit, " W")}${ok(d.power_max) && d.power_max !== d.power_limit ? `, max ${int(d.power_max)}` : ""}`);
  html(el, "powm", meter(d.power / d.power_limit, d.throttle?.includes("power_brake") ? "critical" : ""));
  const ts = tempSev(d);
  html(el, "temp", ok(d.temp) ? `${d.temp}<small> °C</small>` : "n/a");
  html(el, "temps", ok(d.temp_slow) ? `<span class="k">slows down at</span> ${d.temp_slow} °C` : "");
  html(el, "tempm", meter(d.temp / (d.temp_shut || d.temp_slow + 10 || 100), ts));

  const th = (d.throttle || []).map(k => THROTTLE[k] || ["neutral", k]);
  if (ts && !(d.throttle || []).some(k => k.includes("thermal"))) th.push([ts, ts === "critical" ? "at slowdown temperature" : "running hot"]);
  if (ok(d.pcie_width) && ok(d.pcie_width_max) && d.pcie_width < d.pcie_width_max) th.push(["warning", `pcie x${d.pcie_width} of x${d.pcie_width_max}`]);
  if (ok(d.nvl_total) && d.nvl_active < d.nvl_total) th.push(["critical", `${d.nvl_total - d.nvl_active} nvlink down`]);
  if (d.ecc_uncorr > 0) th.push(["critical", "uncorrectable ecc"]);
  if (d.remap_fail) th.push(["critical", "row remap failed"]);
  else if (d.remap_pending) th.push(["warning", "row remap needs a reset"]);
  html(el, "flags", d.throttle === null && !th.length ? "" :
    (th.length ? th : [["good", "running free"]]).map(([sv, l]) => flag(sv, l)).join(""));

  fact(el, "clksm", `${int(d.clk_sm)} <span class="k">/ ${int(d.clk_sm_max)} MHz</span>`, ok(d.clk_sm));
  fact(el, "clkmem", `${int(d.clk_mem)} <span class="k">/ ${int(d.clk_mem_max)} MHz</span>`, ok(d.clk_mem));
  fact(el, "pstate", `P${d.pstate}`, ok(d.pstate));
  fact(el, "pcie", `gen${d.pcie_gen} x${d.pcie_width} <span class="k">/ gen${d.pcie_gen_max} x${d.pcie_width_max}</span>`, ok(d.pcie_gen));
  fact(el, "pciein", rate(d.pcie_rx), ok(d.pcie_rx));
  fact(el, "pcieout", rate(d.pcie_tx), ok(d.pcie_tx));
  fact(el, "nvlink", `${d.nvl_active} <span class="k">of ${d.nvl_total} up</span>`, ok(d.nvl_total));
  fact(el, "ecc", `${int(d.ecc_corr)} <span class="k">corr</span> ${int(d.ecc_uncorr)} <span class="k">uncorr</span>`, d.ecc_on === 1);
  fact(el, "eccagg", `${int(d.ecc_corr_agg)} <span class="k">corr</span> ${int(d.ecc_uncorr_agg)} <span class="k">uncorr</span>`, d.ecc_on === 1 && ok(d.ecc_corr_agg));
  fact(el, "remap", `${int(d.remap_corr)} <span class="k">corr</span> ${int(d.remap_unc)} <span class="k">uncorr</span>`, ok(d.remap_corr));
  fact(el, "fan", pct(d.fan), ok(d.fan));
  fact(el, "codec", `${pct(d.enc)} / ${pct(d.dec)}`, ok(d.enc));
  fact(el, "energy", ok(d.energy) ? `${(d.energy / 3.6e6).toFixed(2)} kWh` : "", ok(d.energy));
  fact(el, "persist", d.persist ? "on" : "off", ok(d.persist));
  fact(el, "mig", d.mig ? "on" : "off", ok(d.mig));
  fact(el, "cores", int(d.cores), ok(d.cores));
  fact(el, "bus", int(d.bus_width, "-bit"), ok(d.bus_width));
  fact(el, "vbios", esc(d.vbios), !!d.vbios);
}

function renderGpus(s) {
  const G = s.gpu, devs = G.devices;
  const key = devs.map(d => d.index + d.name + d.bus).join("|") || "none";
  if (key !== gpuKey) {
    gpuKey = key;
    buildGpus(devs);
    if (!devs.length)
      $("#gpus").innerHTML = `<div class="rule"></div><div class="empty">${G.loaded
        ? "The NVIDIA driver is loaded but reports no GPUs."
        : "No NVIDIA driver found, so only host stats are shown." + (G.error ? ` <span class="dim">(${esc(G.error)})</span>` : "")}</div>`;
  }
  const n = devs.length;
  const title = n ? `${n}× ${devs[0].short}${devs.some(d => d.short !== devs[0].short) ? " and others" : ""}` : "no gpus";
  if ($("#gtitle").textContent !== title) $("#gtitle").textContent = title;

  const util = devs.filter(d => ok(d.util)), avg = util.length ? util.reduce((a, d) => a + d.util, 0) / util.length : NaN;
  const stale = G.loaded && !G.fresh && n > 0;
  let agg = "";
  if (n) {
    const tp = devs.reduce((a, d) => a + (d.power || 0), 0), tl = devs.reduce((a, d) => a + (d.power_limit || 0), 0);
    const mu = devs.reduce((a, d) => a + (d.mem_used || 0), 0), mt = devs.reduce((a, d) => a + (d.mem_total || 0), 0);
    const hot = devs.reduce((a, d) => (d.temp ?? -1) > (a.temp ?? -1) ? d : a, devs[0]);
    agg = kv("avg util", pct(avg)) + kv("power", `${int(tp)} / ${int(tl, " W")}`) +
          kv("memory", `${bytes(mu)} / ${bytes(mt, 0)}`) +
          (n > 1 ? kv("hottest", `gpu ${hot.index} at ${int(hot.temp, " °C")}`) : kv("temp", int(hot.temp, " °C")));
  }
  setHTML($("#agg"), agg);
  setHTML($("#notice"), stale ? flag("critical", `gpu data is ${dur(G.age)} old: the NVIDIA driver stopped answering. ` +
    "GPU jobs may be stuck too; avoid running nvidia-smi on this node.") : "");

  // overview: one dithered bar per GPU, on nodes with more than one
  const bx = $("#bars");
  if (n > 1) {
    const w = Math.min(n * 22, 360);
    if (bx._n !== n) {
      bx._n = n;
      bx.innerHTML = `<div class="cores" style="width:${w}px;height:40px;margin:0"><canvas></canvas></div>` +
        `<div class="idx">${devs.map(d => `<span style="width:${w / n}px">${d.index}</span>`).join("")}</div>`;
    }
    const box = bx.firstChild;
    bars(box, box.firstChild, devs.map(d => ok(d.util) ? d.util / 100 : null), "--mauve", 2);
  } else if (bx._n) { bx._n = 0; bx.innerHTML = ""; }

  $("#gpus").querySelectorAll(".gpu").forEach(el => el.classList.toggle("stale", stale));
  for (const d of devs) {
    const el = $(`[data-gpu="${d.index}"]`);
    if (el) renderGpu(el, d);
  }
  favicon(ok(avg) ? avg / 100 : (s.host.cpu || 0) / 100, stale ? "critical" : "");
}

// ------------------------------------------------------------ header
function renderHeader(s) {
  const n = s.node;
  if ($("#name").textContent !== n.name) $("#name").textContent = n.name;
  let m = kv("up", dur(s.host.uptime));
  if (n.os) m += kv("os", esc(n.os));
  if (n.kernel) m += kv("kernel", esc(n.kernel.replace(/^Linux /, "")));
  if (n.driver) m += kv("driver", esc(n.driver));
  if (n.cuda) m += kv("cuda", esc(n.cuda));
  if (n.cpu_model) m += kv("cpu", esc(n.cpu_model));
  setHTML($("#meta"), m);
  const util = s.gpu.devices.filter(d => ok(d.util));
  document.title = n.name + (util.length ? ` ${Math.round(util.reduce((a, d) => a + d.util, 0) / util.length)}%` : "");
}

// ------------------------------------------------------------ data flow
function push(row) {
  if (!row || (H.length && row[0] <= H[H.length - 1][0])) return;
  H.push(row);
  const cut = row[0] - WINDOW - 5;
  while (H.length && H[0][0] < cut) H.shift();
}
const drawAll = () => { for (const g of graphs.values()) draw(g); };

function render(s) {
  S = s;
  push(s.row);
  renderHeader(s);
  renderHost(s);
  renderGpus(s);
  drawAll();
}

function live(state, text) {
  const l = $("#live");
  l.dataset.s = state;
  if (l.textContent !== text) l.textContent = text;
}

async function loadHistory() {
  try {
    const rows = await (await fetch("api/history")).json();
    const all = rows.concat(H).sort((a, b) => a[0] - b[0]);
    H.length = 0;
    for (const r of all) push(r);
    drawAll();
  } catch (e) { /* history is optional */ }
}

function connect() {
  const es = new EventSource("api/events");
  let watchdog;
  const arm = () => { clearTimeout(watchdog); watchdog = setTimeout(() => live("down", "no data"), 5000); };
  es.onopen = () => { live("live", "live"); loadHistory(); arm(); };
  es.onmessage = e => { live("live", "live"); arm(); render(JSON.parse(e.data)); };
  es.onerror = () => live("down", "reconnecting");
}

let resizeT;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S) render(S); }, 60); });
document.fonts.ready.then(() => { if (S) render(S); });
favicon(0, "");
connect();
</script>
</body>
